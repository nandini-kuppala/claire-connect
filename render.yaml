# One-click deploy on Render (Blueprint). Secrets are entered in the Render dashboard, never committed.
services:
  - type: web
    name: claire-connect
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXCONN_AREA
        value: SG
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nexconn
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_WEB_URL
        sync: false
      - key: PUBLIC_SERVER_URL
        sync: false
      - key: DEMO_OTP
        value: "123456"
